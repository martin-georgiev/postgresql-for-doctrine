deptrac:
  paths:
    - ../../fixtures
    - ../../src
    - ../../tests

  layers:
    # Covers the whole ORM subtree rather than AST\Functions alone, so that plain AST
    # nodes sitting outside the Functions subnamespace stay inside the layer.
    - name: Functions
      collectors:
        - type: class
          value: ^MartinGeorgiev\\Doctrine\\ORM\\.*
    - name: Types
      collectors:
        - type: class
          value: ^MartinGeorgiev\\Doctrine\\DBAL\\Types\\.*
    - name: Utils
      collectors:
        - type: class
          value: ^MartinGeorgiev\\Utils\\.*
    - name: Fixtures
      collectors:
        - type: class
          value: ^Fixtures\\MartinGeorgiev\\.*
    - name: Integration Tests
      collectors:
        - type: class
          value: ^Tests\\Integration\\MartinGeorgiev\\.*
    - name: Unit Tests
      collectors:
        - type: class
          value: ^Tests\\Unit\\MartinGeorgiev\\.*

  ruleset:
    Functions:
      - Functions
      - Utils
    Types:
      - Types
      - Utils
    Utils:
      - Utils
    Fixtures:
      - Fixtures
      - Functions
      - Types
      - Utils
    Integration Tests:
      - Integration Tests
      - Fixtures
      - Functions
      - Types
      - Utils
    Unit Tests:
      - Unit Tests
      - Fixtures
      - Functions
      - Types
      - Utils
