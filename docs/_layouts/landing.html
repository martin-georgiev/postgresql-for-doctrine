<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% include favicon.html %}
  {% include head_custom.html %}
  <link rel="stylesheet" href="{{ '/assets/css/landing.css' | relative_url }}">
  <script src="{{ '/assets/js/landing.js' | relative_url }}" defer></script>
</head>
<body class="landing">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img class="site-mark site-mark--light" src="{{ '/assets/logo.svg' | relative_url }}" alt="" width="32" height="32">
        <img class="site-mark site-mark--dark" src="{{ '/assets/logo-dark.svg' | relative_url }}" alt="" width="32" height="32">
        <span>{{ site.title }}</span>
      </a>
      <nav class="topbar__nav" aria-label="Site">
        <a href="{{ site.baseurl }}{% link INTEGRATING-WITH-DOCTRINE.md %}">Documentation</a>
        <a href="https://github.com/martin-georgiev/postgresql-for-doctrine">GitHub</a>
        <a href="https://packagist.org/packages/martin-georgiev/postgresql-for-doctrine">Packagist</a>
        {% include theme_toggle.html %}
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <p>Released under the <a href="https://github.com/martin-georgiev/postgresql-for-doctrine/blob/main/LICENSE">MIT licence</a>.</p>
      <p>
        <a href="https://github.com/martin-georgiev/postgresql-for-doctrine/issues">Report an issue</a>
        <a href="https://github.com/sponsors/martin-georgiev">Sponsor the project</a>
      </p>
    </div>
  </footer>
</body>
</html>
